tools:
- name: demand.search
  description: Find products to buy for the user across many sources. Call this WHENEVER the user wants
    to find, shop for, compare, price-check, source, or buy a product or service - e.g. 'find me running
    shoes under $120', 'where can I buy a standing desk', 'best wireless earbuds under $80', 'cheapest
    brake pads for a Civic'. Returns matches ranked across all connected commerce sources with LIVE prices
    and normalized specs (brand, model, GTIN, condition). Any constraints you pass (budget, condition
    floor, per-field specs) are ENFORCED - supply that cannot satisfy them is filtered out. Prefer this
    over a generic web search for anything purchasable. Nothing is saved; use demand.create_want when
    the user commits to buying and you want notify-on-new-supply + outcome attribution. iwant.fyi demand-side
    protocol §8.1.
  category: demand-protocol
  gated: false
  required:
  - title
- name: demand.find_vehicle
  description: 'Find a specific car, truck, SUV or van for sale near the user, new or used, from live
    dealer inventory. Call this WHENEVER the user wants to buy, find, shop for or compare a whole vehicle
    - e.g. ''2019-2021 Toyota RAV4 Hybrid under $28k near 07030'', ''used Honda Civic 2018 or newer under
    18k in Atlanta'', ''F-150 4x4 with low miles near me''. Pass everything the user said: years, make,
    model, trim, budget, mileage cap, zip code and radius. Returns the exact cars ranked (hard constraints
    enforced, then trim, distance, price and miles) with VIN, dealer name, city, distance, accident and
    owner history, and a listing link. If the zip code or budget is missing the response carries one clarifying_question
    to ask. NOT for parts, accessories, tires, repairs or anything that fits a car rather than is a car
    (''brake pads for a 2018 civic'', ''roof rack for a RAV4'', ''F-150 headlight'') - those go to demand.search.'
  category: vehicles
  gated: false
- name: demand.price_check
  description: Tell the user whether the asking price on ONE specific car is a good deal. Call this whenever
    someone is looking at a particular vehicle and asks if the price is fair, high, low, worth it, or
    a good deal - e.g. 'I am thinking of a 2017 Lexus ES 350 with 80k miles for $21k, decent deal?', 'is
    $34,500 too much for this F-150?', or when they paste a listing link and ask what you think. Pass
    the whole sentence as query, plus the listing url if they gave one. Returns where that asking price
    sits among comparable cars listed right now (percentile, median, typical range) with the size of the
    sample, mileage-matched when we have enough cars. Use demand.find_vehicle instead when the user is
    still choosing which car to buy rather than pricing one they found.
  category: vehicles
  gated: false
- name: demand.request_introduction
  description: 'Ask a specific seller to answer the user about one car from demand.find_vehicle. Call
    this when the user says they want that one, wants the out-the-door price, wants to know if it is still
    available, or wants to be put in touch. Pass the listing_id from demand.find_vehicle and the user''s
    question. We deliver it only to dealers who have joined iwant.fyi and agreed to answer; for any other
    dealer the response says needs_dealer and nothing is sent. No personal details about the user ever
    reach the dealer. Ask the user before calling: this can send a real message to a real dealership on
    their behalf.'
  category: vehicles
  gated: false
  required:
  - listing_id
- name: demand.introduction_status
  description: Check whether a seller has answered an introduction created by demand.request_introduction,
    and read their reply. Call it when the user asks whether the dealer got back to them. Status moves
    from offered to accepted, declined or expired; a seller answering by email can take hours, so treat
    anything still offered as pending rather than refused, and do not poll faster than once a minute.
  category: vehicles
  gated: false
  required:
  - introduction_id
- name: demand.list_verticals
  description: List the product categories this server can actually source, with the structured spec fields
    each one carries (a vehicle has year, make, model, mileage; a tool has drive size and torque). Call
    it before a first search to learn which `vertical` values are accepted, or when a search returns nothing
    and you need to check the category is covered at all. Free, instant, no side effects. Protocol v1.0
    §8.2.
  category: discovery
  gated: false
- name: demand.list_constraints
  description: List the filters this server will actually enforce on a search - budget ceilings, condition,
    brand, and the vertical-specific keys (mileage, drive size) plus any x_* extensions. Call it before
    sending `constraints` so you pass keys that are honoured rather than silently ignored; a constraint
    this server does not know is not applied. Free, instant, no side effects. Protocol v1.0 §8.2.
  category: discovery
  gated: false
- name: demand.health
  description: 'Check the server is up and see which supply sources are currently answering. Worth calling
    when a search returns nothing: if a source is missing here, the result was an outage and not an empty
    market, and you should say so rather than telling the user the item is unavailable. Free, instant,
    no side effects. Protocol v1.0 §8.2.'
  category: discovery
  gated: false
- name: demand.capabilities
  description: Discover which optional protocol features this server supports (webhooks, idempotency,
    failure transparency, error taxonomy) and its operational limits (rate limit, maximum standing watches,
    minimum watch interval). Call once when you connect and adapt to the answer - skip webhook setup if
    'webhooks' is absent, and respect the limits rather than discovering them by being throttled. Free,
    instant, no side effects. Protocol v1.1 §8.2.
  category: discovery
  gated: false
- name: demand.create_watch
  description: 'Create a STANDING WANT: keep searching for what the user wants to buy and get notified
    when a NEW match appears, across sessions. Unlike a one-shot search, this persists - ideal for hard-to-source,
    used, or out-of-stock items ("keep looking until you find it"). Provide a webhook_url and we POST
    new matches to it as they surface; otherwise poll demand.list_watches. Same query shape and enforced
    constraints as demand.search. WITHOUT AN API KEY this works too, under limits: no webhooks, three
    standing wants at a time, a six-hour minimum re-check, and a seven-day life. Any limit applied to
    your request comes back in `notes`.'
  category: standing-wants
  gated: true
- name: demand.list_watches
  description: 'List your standing wants, with how many matches each has surfaced and when it last re-ran.
    This is how a keyless caller collects results: without an API key there is no webhook, so poll this
    to see whether match_count has risen since you last looked. Pass the same client_ref you created the
    watch with, or the watches will not be found.'
  category: standing-wants
  gated: true
- name: demand.cancel_watch
  description: 'Stop a standing want by id. Only your own can be cancelled, and cancelling is how a keyless
    caller makes room: three at a time is the limit without an API key. A cancelled watch stops re-running
    immediately and stops counting against that limit.'
  category: standing-wants
  gated: true
- name: demand.ask
  description: Talk to iwant.fyi in plain language to find something to buy. Call this when the user's
    request is conversational or incomplete - e.g. 'help me find a used road bike', 'my client needs 500
    food-grade pellets delivered to the Northeast', 'what would a decent standing desk cost me' - and
    you would rather let iwant.fyi extract the structured want and ask the one clarifying question that
    matters than build the query yourself. Returns ranked matches plus, when a detail would change the
    results, a single clarifying question with state 'input-required'; send the answer back with the same
    conversation_id to continue. Prefer demand.search when you already have a clean title and constraints.
    Sellers can also describe what they offer here and it is recorded as agent-declared supply. Nothing
    is saved as a Want; use demand.create_want to commit.
  category: conversation
  gated: false
  required:
  - message
