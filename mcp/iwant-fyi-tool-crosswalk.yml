  mcp: https://iwant.fyi/api/mcp                          # tools/list public (10 no-key tools with inputSchema); 16 further tools key-gated
  a2a: https://iwant.fyi/api/a2a                          # message/send public; same matching as demand.search / demand.ask
  graphql: null
