purpose: >-
  iwant.fyi is MCP-native: the canonical demand.* surface is defined by the protocol spec and mirrored
  by an HTTP fallback under /api/v1, while the published OpenAPI describes only the older legacy
  marketplace REST surface under /api. The crosswalk shows that the OpenAPI covers the legacy tools
  and NOT the canonical protocol — the biggest contract gap in this profile.
