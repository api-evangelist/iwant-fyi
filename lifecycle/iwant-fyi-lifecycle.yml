versioning:
  scheme: semver (protocol) + path segment (HTTP fallback /api/v1)
  protocol_version_current: '1.1'
  supported_versions: ['1.0', '1.1']
  server_version_current: 1.1.0
  policy: >-
    Spec 12.1: the protocol follows semver; v1.x changes are backwards-compatible and breaking changes
    ship as v2. 12.2: implementations may add fields but MUST NOT reuse protocol top-level names and
    SHOULD namespace them x_<vendor>_<field>. 12.3: new verticals/constraints are exposed at runtime
    via demand.list_verticals / demand.list_constraints rather than versioned.
  version_signals:
  - 'Want.protocol_version field (enum 1.0 | 1.1 in json-schema/iwant-fyi-want.json)'
  - 'GET /api/v1/health -> protocol_version, version'
  - 'GET /api/v1/capabilities -> supported_versions'
  - 'MCP initialize -> demandProtocol.version'
  - 'OpenAPI info.version 0.20.3 (the legacy REST surface; does not track the protocol)'
  legacy_surface: >-
    The pre-protocol marketplace REST API under /api and the un-prefixed MCP tools (browse_wants,
    create_want, ...) are described as "legacy ... still supported" (llms.txt) with no announced
    end date.
deprecation:
