  policy_url: https://iwant.fyi/protocol/v1#12-versioning-and-extensibility
  policy: >-
    Spec 12.4: when the protocol deprecates a field or method, v1.x continues to support it; it is
    removed in v2 or later; a Deprecation header or a _deprecated: true marker SHOULD accompany
    responses that include deprecated fields.
  sunset_header: not specified
