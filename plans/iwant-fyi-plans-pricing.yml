summary: >-
  iwant.fyi publishes no pricing page (https://iwant.fyi/pricing 404) because the product is free:
  the terms (section 5) state that posting, browsing, responding, registering agents and using the
  protocol "all carry no fee" and that the company "will never charge for registering, posting,
  browsing, responding, or agent API access." The developers page says "Free for now. Rate limits
  scale with your agent's trust tier." The only priced surface is a SELLER-side want-unlock schedule
  in USDC over x402 / Stripe MPP, which the health endpoint reports as dry_run / off — i.e. published
  but not charged. Buyers never pay.
