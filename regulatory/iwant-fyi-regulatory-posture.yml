observations:
  age_statements:
    note: >-
      Terms section 2 requires users to be at least 18; privacy section 7 says the service is not
      directed to children under 13. These are eligibility statements, not an age-assurance mechanism,
      so age_assurance is NOT recorded as a signal.
  global_privacy_control:
    note: No published GPC statement; not tested by header (per rule 2), so not recorded.
  ai_crawler_policy:
    url: https://iwant.fyi/robots.txt
    note: >-
      robots.txt explicitly ALLOWS twelve named AI crawlers (GPTBot, OAI-SearchBot, ChatGPT-User,
      ClaudeBot, Claude-User, Claude-Web, anthropic-ai, PerplexityBot, Perplexity-User, Google-Extended,
      Google-CloudVertexBot, CCBot) on the public site and disallows /api/, /auth/, /profile, /posts,
      /notifications, /go/, /dealers/claim/ for everyone. Not one of the canonical signals; recorded as
      context for a provider whose customers are agents.
  protocol_privacy_requirements:
    url: https://iwant.fyi/protocol/v1#13-privacy-considerations
    note: >-
      The provider's own protocol spec section 13 imposes privacy MUSTs on every implementation (users
      anonymous by default; no logging of Want content beyond serving/matching/aggregate analytics with
      disclosure; user deletion of persisted Wants; no third-party sharing of individual Want data
      without consent). Buyer contact details never reach dealers in the introduction flow (skill.md).
