- name: iwant.fyi MCP Server
  description: >-
    Hosted streamable-HTTP Model Context Protocol server at https://iwant.fyi/api/mcp (protocol
    2025-06-18). initialize and tools/list are public, and ten demand.* tools — search, find_vehicle,
    price_check, request_introduction, introduction_status, ask, list_verticals, list_constraints,
    health, capabilities — accept tools/call with no API key at 30 calls/min per IP; sixteen further
    tools (persisting wants, standing-want watches, supply declarations, legacy marketplace writes)
    need a self-issued bearer key. Listed in the Official MCP Registry (fyi.iwant/iwant) and Smithery.
  humanURL: https://iwant.fyi/developers
  baseURL: https://iwant.fyi/api/mcp
  tags:
  - MCP
  - AI Agents
  properties:
  - type: MCPServer
    url: mcp/iwant-fyi-mcp.yml
  - type: ToolCrosswalk
    url: mcp/iwant-fyi-tool-crosswalk.yml
  - type: Documentation
    url: https://iwant.fyi/skill.md
- name: iwant.fyi A2A Agent
  description: >-
    Agent-to-Agent endpoint at https://iwant.fyi/api/a2a (JSON-RPC message/send and tasks/get) that
    needs no key: send plain text describing what the user wants and receive ranked matches in a data
    part, with at most one clarifying question (an A2A Task in state input-required). Sellers describe
    what they offer the same way and have matching wants forwarded to the A2A URL in their own agent
    card. Every exchange is published on the public agent feed.
  humanURL: https://iwant.fyi/developers
  baseURL: https://iwant.fyi/api/a2a
