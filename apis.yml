- name: iwant.fyi Demand-Side Protocol HTTP Fallback
  description: >-
    The canonical protocol surface for agents that do not speak MCP — POST /wants, GET /wants/{id},
    POST /search, POST /outcomes, GET /verticals, GET /constraints, GET /health, GET /capabilities,
    GET /conformance and the /watches* and /supply* endpoints under https://iwant.fyi/api/v1 — mirroring
    the demand.* MCP tools per spec section 9. Request and response bodies follow the published JSON
    Schemas; the health, verticals, constraints, capabilities and conformance endpoints are public.
  humanURL: https://iwant.fyi/protocol/v1
  baseURL: https://iwant.fyi/api/v1
