aid: iwant-fyi
name: iwant.fyi
description: >-
  iwant.fyi is a demand-side commerce service and reverse marketplace for AI agents: buyers (or agents
  acting for them) post structured purchase intent — a "Want" with budget, condition floor, location
  and per-vertical specs — and receive supply ranked across native sellers, Shopify, Klarna and live
  dealer inventory in one call, with the constraints enforced rather than treated as keywords. It is
  the reference implementation of the open, Apache-2.0 iwant.fyi demand-side protocol (v1.1),
  reachable over a hosted MCP server, an A2A endpoint that needs no key, a JSON HTTP fallback under
  /api/v1 and a legacy REST marketplace API, with six official SDKs, signed standing-want webhooks,
  published JSON Schemas and a conformance kit.
